    <rect width="480" height="480" fill="url(#lt-dots-404)"></rect>

      <ellipse cx="204" cy="300" rx="192" ry="136" style="stroke: var(--plate-line)"></ellipse>
    </g>
    <path class="lt-path" d="M204 300 L252 276 L300 228 L348 180" pathLength="100" style="fill: none; stroke: var(--plate-ink); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round"></path>

    <circle class="lt-pulse" cx="420" cy="108" r="8" style="fill: none; stroke: var(--signal); stroke-width: 1.2"></circle>
    <circle class="lt-node" cx="420" cy="108" r="8" style="fill: none; stroke: var(--signal); stroke-width: 2; animation-delay: 2.1s"></circle>
    <text x="300" y="96" style="font: 13px var(--mono); fill: var(--plate-ink)">p(x) ≈ 0</text>
    <text x="160" y="352" style="font: 12px var(--mono); fill: var(--plate-ink-2)">your site</text>
